<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
  <title>Absolute Browser — By Fun Talk Club</title>

  <script src="/scram/scramjet.all.js"></script>
  <script src="/baremux/index.js"></script>
  <script src="register-sw.js" defer></script>
  <script src="search.js" defer></script>

  <script src="https://tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cloudflare.com" />
  <style>
    @import url('https://googleapis.com');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #09090f;
      color: #f8fafc;
      overflow: hidden;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass-panel {
      background: rgba(20, 20, 34, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(139, 92, 246, 0.2);
    }
    .tab-active {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.25), rgba(37, 99, 235, 0.25));
      border-color: rgba(139, 92, 246, 0.5);
    }
  </style>
</head>

<body class="flex flex-col h-screen select-none">

  <form id="sj-form" class="hidden">
    <input id="sj-search-engine" value="https://duckduckgo.com" type="hidden" />
    <input id="sj-address" type="text" />
  </form>

  <header class="bg-[#0d0d17] border-b border-purple-900/30 px-2 pt-2 flex items-center gap-1.5">
    <div id="tabs-container" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar max-w-[calc(100vw-50px)]"></div>
    <button onclick="createTab()" title="New Tab" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition shrink-0">
      <i class="fa-solid fa-plus text-xs"></i>
    </button>
  </header>

  <div class="bg-[#11111e] border-b border-purple-900/30 px-3 py-2 flex items-center gap-2.5 shadow-md z-10">
    <div class="flex items-center gap-1">
      <button onclick="navBack()" title="Back" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition">
        <i class="fa-solid fa-arrow-left text-sm"></i>
      </button>
      <button onclick="navForward()" title="Forward" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition">
        <i class="fa-solid fa-arrow-right text-sm"></i>
      </button>
      <button onclick="navReload()" title="Reload" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition">
        <i class="fa-solid fa-rotate-right text-sm"></i>
      </button>
      <button onclick="goHome()" title="Home" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition">
        <i class="fa-solid fa-house text-sm"></i>
      </button>
    </div>

    <form onsubmit="handleAddressSubmit(event)" class="flex-1 flex items-center bg-[#09090f] border border-purple-500/30 focus-within:border-purple-500 rounded-xl px-3.5 py-1.5 transition">
      <i class="fa-solid fa-shield-halved text-purple-400 text-xs mr-2.5"></i>
      <input
        id="address-input"
        type="text"
        placeholder="Search DuckDuckGo or enter any URL..."
        autocomplete="off"
        class="w-full bg-transparent text-sm text-white placeholder-slate-500 focus:outline-none"
      />
      <button type="button" onclick="toggleBookmark()" id="bookmark-btn" title="Bookmark this page" class="text-slate-400 hover:text-yellow-400 ml-2 transition">
        <i class="fa-regular fa-star text-sm"></i>
      </button>
    </form>

    <div class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-purple-950/60 border border-purple-500/30 text-[11px] font-medium text-purple-300">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span>Connected</span>
    </div>
  </div>

  <div id="bookmarks-bar" class="bg-[#0d0d17] border-b border-purple-900/20 px-4 py-1.5 flex items-center gap-2 overflow-x-auto no-scrollbar text-xs hidden"></div>

  <main id="viewport" class="flex-1 relative bg-[#09090f] overflow-hidden">
    <div id="new-tab-view" class="absolute inset-0 flex flex-col items-center justify-center p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-purple-900/25 via-[#09090f] to-[#09090f] overflow-y-auto">
      <div id="clock" class="text-5xl sm:text-6xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-blue-400 to-cyan-300 mb-2">
        12:00
      </div>
      <p id="date-display" class="text-slate-400 text-sm mb-8">Tuesday, November 17</p>

      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-600 to-blue-600 flex items-center justify-center shadow-lg shadow-purple-600/30">
          <i class="fa-solid fa-compass text-white text-xl"></i>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">Absolute Browser</h1>
      </div>

      <form onsubmit="handleCenterSearch(event)" class="w-full max-w-xl mb-8">
        <div class="flex items-center glass-panel rounded-2xl px-4 py-3.5 shadow-2xl shadow-purple-950/40 focus-within:border-purple-400 transition">
          <i class="fa-solid fa-magnifying-glass text-purple-400 mr-3"></i>
          <input
            id="center-search-input"
            type="text"
            placeholder="Search the web freely or type a website URL..."
            autocomplete="off"
            class="w-full bg-transparent text-base text-white placeholder-slate-400 focus:outline-none"
          />
          <button type="submit" class="ml-2 px-4 py-1.5 rounded-xl bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-xs font-semibold text-white transition">
            Go
          </button>
        </div>
      </form>

      <div id="error-wrapper" class="hidden w-full max-w-xl mb-6 p-3 rounded-xl bg-red-950/50 border border-red-500/40 text-xs text-red-300">
        <p id="sj-error" class="font-semibold"></p>
        <pre id="sj-error-code" class="mt-1 overflow-x-auto text-[11px] text-red-200/80"></pre>
      </div>

      <div class="grid grid-cols-3 sm:grid-cols-6 gap-3 sm:gap-4 max-w-xl w-full">
        <button onclick="navigate('https://funtalkclub.com')" class="group flex flex-col items-center gap-2 p-3 rounded-2xl glass-panel hover:border-purple-400/60 transition">
          <div class="w-10 h-10 rounded-xl bg-purple-600/20 text-purple-400 group-hover:scale-110 transition flex items-center justify-center">
            <i class="fa-solid fa-comments"></i>
          </div>
          <span class="text-xs text-slate-300 truncate w-full text-center">Fun Talk Club</span>
        </button>

        <button onclick="navigate('https://duckduckgo.com')" class="group flex flex-col items-center gap-2 p-3 rounded-2xl glass-panel hover:border-purple-400/60 transition">
          <div class="w-10 h-10 rounded-xl bg-orange-500/20 text-orange-400 group-hover:scale-110 transition flex items-center justify-center">
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
          <span class="text-xs text-slate-300 truncate w-full text-center">DuckDuckGo</span>
        </button>

        <button onclick="navigate('https://youtube.com')" class="group flex flex-col items-center gap-2 p-3 rounded-2xl glass-panel hover:border-purple-400/60 transition">
          <div class="w-10 h-10 rounded-xl bg-red-500/20 text-red-400 group-hover:scale-110 transition flex items-center justify-center">
            <i class="fa-brands fa-youtube"></i>
          </div>
          <span class="text-xs text-slate-300 truncate w-full text-center">YouTube</span>
        </button>

        <button onclick="navigate('https://discord.com')" class="group flex flex-col items-center gap-2 p-3 rounded-2xl glass-panel hover:border-purple-400/60 transition">
          <div class="w-10 h-10 rounded-xl bg-indigo-500/20 text-indigo-400 group-hover:scale-110 transition flex items-center justify-center">
            <i class="fa-brands fa-discord"></i>
          </div>
          <span class="text-xs text-slate-300 truncate w-full text-center">Discord</span>
        </button>

        <button onclick="navigate('https://wikipedia.org')" class="group flex flex-col items-center gap-2 p-3 rounded-2xl glass-panel hover:border-purple-400/60 transition">
          <div class="w-10 h-10 rounded-xl bg-slate-500/20 text-slate-300 group-hover:scale-110 transition flex items-center justify-center">
            <i class="fa-brands fa-wikipedia-w"></i>
          </div>
          <span class="text-xs text-slate-300 truncate w-full text-center">Wikipedia</span>
        </button>

        <button onclick="navigate('https://github.com')" class="group flex flex-col items-center gap-2 p-3 rounded-2xl glass-panel hover:border-purple-400/60 transition">
          <div class="w-10 h-10 rounded-xl bg-blue-500/20 text-blue-400 group-hover:scale-110 transition flex items-center justify-center">
            <i class="fa-brands fa-github"></i>
          </div>
          <span class="text-xs text-slate-300 truncate w-full text-center">GitHub</span>
        </button>
      </div>
    </div>

    <div id="frames-container" class="w-full h-full"></div>
  </main>

  <footer class="bg-[#09090f] border-t border-purple-900/20 py-1.5 px-4 flex items-center justify-between text-[11px] text-slate-500">
    <span>Absolute Browser</span>
    <span>By <a href="https://funtalkclub.com" target="_blank" class="text-purple-400 hover:underline font-medium">Fun Talk Club</a></span>
  </footer>

  <script>
    let tabs = [];

let activeTabId = null;
let bookmarks = JSON.parse(localStorage.getItem('ab_bookmarks') || '[]');
let proxyController = null;
async function initProxy() {
try {
if (typeof ScramjetController !== 'undefined') {
proxyController = new ScramjetController({
files: {
wasm: '/scram/scramjet.wasm.js',
worker: '/scram/scramjet.worker.js',
client: '/scram/scramjet.client.js',
shared: '/scram/scramjet.shared.js',
sync: '/scram/scramjet.sync.js',
},
});
await proxyController.init();
}
if (typeof BareMux !== 'undefined') {
const connection = new BareMux.BareMuxConnection('/baremux/worker.js');
const wispUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/wisp/';
await connection.setTransport('/libcurl/index.mjs', [{ wisp: wispUrl }]);
}
} catch (err) {
console.error('Connection warning:', err);
document.getElementById('error-wrapper').classList.remove('hidden');
document.getElementById('sj-error').textContent = 'Connection Notice:';
document.getElementById('sj-error-code').textContent = err.toString();
}
}
function updateClock() {
const now = new Date();
document.getElementById('clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
document.getElementById('date-display').textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}
setInterval(updateClock, 1000);
updateClock();
function formatInputToUrl(input) {
if (typeof search === 'function') {
return search(input, 'duckduckgo.com');
}
const trimmed = input.trim();
if (!trimmed) return '';
if (/^https?:///i.test(trimmed)) return trimmed;
if (trimmed.includes('.') && !trimmed.includes(' ')) return 'https://' + trimmed;
return 'duckduckgo.com' + encodeURIComponent(trimmed);
}
function encodeProxyUrl(targetUrl) {
if (proxyController && typeof proxyController.encodeUrl === 'function') {
return proxyController.encodeUrl(targetUrl);
}
if (typeof __scramjet$config !== 'undefined' && __scramjet$config.prefix) {
return __scramjet$config.prefix + encodeURIComponent(targetUrl);
}
return '/scramjet/' + encodeURIComponent(targetUrl);
}
function createTab(url = '') {
const id = 'tab-' + Date.now();
const tab = { id, title: url ? url : 'New Tab', url };
tabs.push(tab);
const frame = document.createElement('iframe');
frame.id = 'frame-' + id;
frame.className = 'w-full h-full border-0 hidden bg-white';
document.getElementById('frames-container').appendChild(frame);
switchTab(id);
if (url) navigate(url);
}
function switchTab(id) {
activeTabId = id;
const currentTab = tabs.find(t => t.id === id);
if (!currentTab) return;
document.querySelectorAll('#frames-container iframe').forEach(f => f.classList.add('hidden'));
const activeFrame = document.getElementById('frame-' + id);
if (currentTab.url) {
document.getElementById('new-tab-view').classList.add('hidden');
if (activeFrame) activeFrame.classList.remove('hidden');
document.getElementById('address-input').value = currentTab.url;
} else {
document.getElementById('new-tab-view').classList.remove('hidden');
document.getElementById('address-input').value = '';
document.getElementById('center-search-input').value = '';
}
updateBookmarkIcon();
renderTabs();
}
function closeTab(e, id) {
e.stopPropagation();
if (tabs.length === 1) {
goHome();
return;
}
const idx = tabs.findIndex(t => t.id === id);
tabs = tabs.filter(t => t.id !== id);
const frame = document.getElementById('frame-' + id);
if (frame) frame.remove();
if (activeTabId === id) {
const nextTab = tabs[Math.max(0, idx - 1)];
switchTab(nextTab.id);
} else {
renderTabs();
}
}
function renderTabs() {
const container = document.getElementById('tabs-container');
container.innerHTML = tabs.map(tab => {
const isActive = tab.id === activeTabId;
return <div onclick="switchTab('${tab.id}')" class="group flex items-center justify-between gap-2 px-3 py-1.5 rounded-t-xl border border-b-0 cursor-pointer min-w-[130px] max-w-[200px] transition ${isActive ? 'tab-active text-white' : 'bg-[#141422]/60 border-transparent text-slate-400 hover:bg-[#1a1a2e]'}"> <span class="text-xs font-medium truncate">${tab.title}</span> <button onclick="closeTab(event, '${tab.id}')" class="w-4 h-4 rounded-full flex items-center justify-center hover:bg-white/20 text-[10px] opacity-70 group-hover:opacity-100"> <i class="fa-solid fa-xmark"></i> </button> </div>;
}).join('');
}
async function navigate(rawInput) {
const targetUrl = formatInputToUrl(rawInput);
if (!targetUrl) return;
if (typeof registerSW === 'function') {
try { await registerSW(); } catch (e) { console.warn(e); }
}
const tab = tabs.find(t => t.id === activeTabId);
if (!tab) return;
tab.url = targetUrl;
try {
tab.title = new URL(targetUrl).hostname.replace('www.', '');
} catch {
tab.title = targetUrl;
}
const frame = document.getElementById('frame-' + tab.id);
if (frame) {
frame.src = encodeProxyUrl(targetUrl);
}
switchTab(tab.id);
}
function handleAddressSubmit(e) {
e.preventDefault();
navigate(document.getElementById('address-input').value);
}
function handleCenterSearch(e) {
e.preventDefault();
navigate(document.getElementById('center-search-input').value);
}
function goHome() {
const tab = tabs.find(t => t.id === activeTabId);
if (!tab) return;
tab.url = '';
tab.title = 'New Tab';
const frame = document.getElementById('frame-' + tab.id);
if (frame) frame.src = 'about:blank';
switchTab(tab.id);
}
function navBack() {
const frame = document.getElementById('frame-' + activeTabId);
if (frame && frame.contentWindow) frame.contentWindow.history.back();
}
function navForward() {
const frame = document.getElementById('frame-' + activeTabId);
if (frame && frame.contentWindow) frame.contentWindow.history.forward();
}
function navReload() {
const frame = document.getElementById('frame-' + activeTabId);
if (frame && frame.src) frame.src = frame.src;
}
function toggleBookmark() {
const tab = tabs.find(t => t.id === activeTabId);
if (!tab || !tab.url) return;
const exists = bookmarks.some(b => b.url === tab.url);
if (exists) {
bookmarks = bookmarks.filter(b => b.url !== tab.url);
} else {
bookmarks.push({ title: tab.title, url: tab.url });
}
localStorage.setItem('ab_bookmarks', JSON.stringify(bookmarks));
updateBookmarkIcon();
renderBookmarks();
}
function updateBookmarkIcon() {
const tab = tabs.find(t => t.id === activeTabId);
const btn = document.getElementById('bookmark-btn');
if (tab && tab.url && bookmarks.some(b => b.url === tab.url)) {
btn.innerHTML = '';
} else {
btn.innerHTML = '';
}
}
function renderBookmarks() {
const bar = document.getElementById('bookmarks-bar');
if (bookmarks.length === 0) {
bar.classList.add('hidden');
return;
}
bar.classList.remove('hidden');
bar.innerHTML = bookmarks.map(b => <button onclick="navigate('${b.url}')" class="px-2.5 py-1 rounded-md bg-white/5 hover:bg-purple-600/20 text-slate-300 hover:text-white transition truncate max-w-[140px]"> ${b.title} </button>).join('');
}
initProxy();
renderBookmarks();
createTab();
